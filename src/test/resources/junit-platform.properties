# Parallel execution is enabled, but everything runs in the same thread by default, and test
# classes always run one after another. Only test methods annotated
# @Execution(ExecutionMode.CONCURRENT) run side by side, within their own class (the slow
# ffmpeg-bound classes: IngestPipelineTest, IngestPipelineSlowTest, EncodeProfileTest,
# RtmpPusherTest). Those classes are annotated @Execution(SAME_THREAD) so the class itself never
# overlaps with other classes (timing-sensitive tests elsewhere stay unaffected).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=6
junit.jupiter.execution.parallel.config.fixed.max-pool-size=6
