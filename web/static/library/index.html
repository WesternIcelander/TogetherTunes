<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · TogetherTunes</title>
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/library.js"></script>
</head>
<body>
  <nav id="site-nav" class="site-nav"><a href="/">TogetherTunes</a></nav>
  <h1>Your library</h1>
  <p class="muted small"><a href="/encodes/">Encodes</a>: what is encoding or queued for the items in your library.</p>
  <p id="library-status" role="status">Loading...</p>

  <div id="library-body" hidden>
    <section id="shares" class="panel" hidden>
      <h2>Shared with you <span id="share-count" class="badge badge-count"></span></h2>
      <ul id="share-rows" class="shares"></ul>
      <button id="shares-seen" type="button">Mark all as seen</button>
    </section>

    <form id="library-search" class="row">
      <input name="q" type="search" maxlength="200" placeholder="Search title, artist or album" aria-label="Search" class="grow">
      <select id="library-kind" name="kind" aria-label="Kind">
        <option value="">Audio and video</option>
        <option value="audio">Audio</option>
        <option value="video">Video</option>
      </select>
      <button type="submit">Search</button>
      <label class="small"><input id="library-all" name="all" type="checkbox"> Search the whole server</label>
    </form>
    <p id="library-notice" class="notice" role="status" hidden></p>
    <p id="library-error" class="error" role="alert"></p>
    <table class="list library">
      <thead><tr><th>Title</th><th>Kind</th><th>Length</th><th>Status</th><th>Added</th><th></th></tr></thead>
      <tbody id="library-rows"></tbody>
    </table>
    <p id="library-empty" class="muted" hidden></p>
    <button id="library-more" type="button" hidden>Load more</button>

    <section class="panel">
      <h2>Add media</h2>
      <div id="add-media"></div>
    </section>
  </div>
</body>
</html>
