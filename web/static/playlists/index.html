<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlists · TogetherTunes</title>
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/playlists.js"></script>
</head>
<body>
  <nav id="site-nav" class="site-nav"><a href="/">TogetherTunes</a></nav>
  <p id="playlists-status" role="status">Loading...</p>
  <p id="playlists-error" class="error" role="alert"></p>

  <div id="playlist-list" hidden>
    <h1>Your playlists</h1>
    <table class="list playlists">
      <thead><tr><th>Name</th><th>Entries</th><th>Changed</th></tr></thead>
      <tbody id="playlist-rows"></tbody>
    </table>
    <p id="playlist-empty" class="muted" hidden>No playlists yet.</p>
    <button id="playlist-more" type="button" hidden>Load more</button>

    <section class="panel">
      <h2>New playlist</h2>
      <form id="playlist-create" class="form">
        <label>Name <input name="name" required maxlength="100"></label>
        <label>Description <textarea name="description" maxlength="2000" rows="2"></textarea></label>
        <button type="submit">Create</button>
      </form>
    </section>
  </div>

  <div id="playlist-detail" hidden>
    <p><a href="/playlists/">← All playlists</a></p>
    <h1 id="playlist-name"></h1>
    <p id="playlist-description" class="description" hidden></p>
    <p id="playlist-summary" class="muted"></p>
    <p class="muted small">Add items from <a href="/library/">your library</a> or an item's page.</p>
    <table class="list entries">
      <thead><tr><th>#</th><th>Title</th><th>Kind</th><th>Length</th><th>Status</th><th></th></tr></thead>
      <tbody id="entry-rows"></tbody>
    </table>
    <p id="entry-empty" class="muted" hidden>This playlist is empty.</p>

    <details class="panel">
      <summary>Edit playlist</summary>
      <form id="playlist-edit" class="form">
        <label>Name <input name="name" required maxlength="100"></label>
        <label>Description <textarea name="description" maxlength="2000" rows="3"></textarea></label>
        <button type="submit">Save</button>
      </form>
      <p><button id="playlist-delete" type="button" class="danger">Delete playlist</button></p>
    </details>
  </div>
</body>
</html>
