<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TogetherTunes setup</title>
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/setup.js"></script>
</head>
<body>
  <h1>Welcome to TogetherTunes</h1>
  <p id="setup-status">Checking setup...</p>
  <form id="setup-form" class="form" hidden>
    <p>Create the administrator account. This is the first account on this server; it gets the <code>admin</code> role.</p>
    <label>Username
      <input name="username" autocomplete="username" required minlength="3" maxlength="32"
             pattern="[A-Za-z0-9][A-Za-z0-9._\-]*">
    </label>
    <small>3 to 32 characters: letters, digits, '.', '_' and '-'.</small>
    <label>Display name (optional)
      <input name="displayName" autocomplete="nickname" maxlength="64">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="1024">
    </label>
    <small>At least 10 characters.</small>
    <label>Repeat password
      <input name="password2" type="password" autocomplete="new-password" required minlength="10" maxlength="1024">
    </label>
    <button type="submit">Create administrator</button>
    <p id="setup-error" class="error" role="alert"></p>
  </form>
</body>
</html>
